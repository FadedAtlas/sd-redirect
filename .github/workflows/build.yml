name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build module zip
        run: bash build.sh

      - name: Find zip
        id: zip
        run: echo "path=$(ls dist/sd-redirect-*.zip)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sd-redirect
          path: ${{ steps.zip.outputs.path }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version=//p' module/module.prop | tr -d '\r[:space:]')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version=$version in module/module.prop"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.path }}" --title "$GITHUB_REF_NAME" --generate-notes
